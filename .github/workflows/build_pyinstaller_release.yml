name: Check Linux standalone executable

on:
  workflow_dispatch:

jobs:
  linux_executable:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-pinned.txt
        python -m pip install pyinstaller==6.22.0
    - name: Build Linux standalone executable
      run: python -m PyInstaller cewe2pdf.spec --noconfirm --clean
    - name: Smoke-test Linux executable
      run: |
        ./dist/cewe2pdf --version
        ./dist/cewe2pdf --outFile tests/testEmptyPageOne/executable-smoke-linux.pdf tests/testEmptyPageOne/test_emptyPageOne.mcf
        test -f tests/testEmptyPageOne/executable-smoke-linux.pdf
