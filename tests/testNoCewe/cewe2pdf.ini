# testNoCewe.mcf uses fonts offered by the album editor, but we need to substitute for the built in
# reportlab fonts, since we are trying to manage with neither CEWE nor system fonts. In the real world,
# using system fonts should work too, as long as cewe2pdf is run on the same operating system as the
# album was created on and loadSystemFonts is True.
missingFontSubstitutions =
    Courier PS: Courier
    Times New Roman: Times-Roman