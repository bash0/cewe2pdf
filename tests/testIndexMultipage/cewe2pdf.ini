[DEFAULT]
cewe_folder = tests/
hpsFolder = tests/hps

[INDEX]
indexing = True
indexEntryFonts =
	Arial Rounded MT Bold, 15
	Poppins, 16
indexFont = Helvetica
indexFontSize = 12
lineSpacing = 1.1
pageWidth = 210
pageHeight = 291 # A4 is 297. 291 is the size of the paper in a 30x30 album
indexMarkerRegex = ^[12]Contents
# pdf margin settings determine how many index lines get onto an index page and how wide they are
pdfTopMargin = 10
pdfBottomMargin = 10
# these margin settings determine where the index page is placed on the page (and how it is scaled)
topMargin = 30
bottomMargin = 22
leftMargin = 25
rightMargin = 25
deleteIndexPdf = True
deleteIndexPng = False