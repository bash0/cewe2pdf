[DEFAULT]
# cewe_folder = C:\Program Files\Elkjop fotoservice\elkjop fotoservice
cewe_folder = tests/
hpsFolder = tests/hps

[CALENDAR]
schemaSubstitutions =
    Cell transparent, Text white, cewe2pdf-test-transparent-white
    schwarz/weiss, cewe2pdf-test-black-white

# On GitHub, this fixture can provide an image with the same basename as its
# editor-created AppData reference.  A normal CEWE installation uses the MCF
# path directly, so it does not need this fallback.
calendarEventImageFolders =
    calendarEventFotos

# Keep the editor's layout names in the MCF while using the local, invented
# test layouts on a machine without CEWE installed.
layoutSubstitutions =
    Year (Long-Name-Big), cewe2pdf-test-year
    Month, cewe2pdf-test-month
    OneWeekPerRow (2), cewe2pdf-test-week-grid
