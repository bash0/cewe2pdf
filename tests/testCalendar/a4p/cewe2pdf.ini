[DEFAULT]
cewe_folder = tests/
hpsFolder = tests/hps

[CALENDAR]
schemaSubstitutions =
    schwarz/weiss, cewe2pdf-test-black-white

# Exercise a locally authored layout rather than CEWE's installed resource.
layoutSubstitutions =
    Year (Long-Name-Big), cewe2pdf-test-year
    Month, cewe2pdf-test-month
    OneWeekPerRow (2), cewe2pdf-test-week-grid
