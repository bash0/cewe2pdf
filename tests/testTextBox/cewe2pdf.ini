[DEFAULT]
noShadows = False

# Do not set cewe_folder = tests here.  That folder supplies the complete
# Poppins family, including its regular face, and would conceal the page 4
# regression.  This fixture needs only the explicitly listed portable fonts,
# its one background folder, and the shared HPS resources below.
# The fixture lists its portable fonts in additional_fonts.txt.  In particular,
# Poppins Italic is deliberately the only supplied Poppins face.
extraBackgroundFolders = tests/Resources/photofun/backgrounds
hpsFolder = tests/hps
